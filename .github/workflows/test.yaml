---
name: test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=5m

  test:
    name: test (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        # didban runs on a Raspberry Pi, so test on native ARM too.
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
      - run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

  cross:
    name: build ${{ matrix.goarch }}${{ matrix.goarm && format('v{0}', matrix.goarm) || '' }}
    needs: [lint]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goarch: arm64 }
          - { goarch: arm, goarm: "7" }
          - { goarch: arm, goarm: "6" }
          - { goarch: amd64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
      - name: build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -ldflags "-s -w" -o didban ./cmd/didban
          echo "| linux/${GOARCH}${GOARM:+v$GOARM} | $(( $(stat -c %s didban) / 1024 )) KiB |" >> "$GITHUB_STEP_SUMMARY"
