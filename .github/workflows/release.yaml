---
name: release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
      - run: go test ./...
      - name: build
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir dist
          for t in arm64 arm:7 arm:6 amd64; do
            arch=${t%%:*}; arm=${t#*:}; [ "$arm" = "$t" ] && arm=
            name="didban_${GITHUB_REF_NAME}_linux_${arch}${arm:+v$arm}"
            GOOS=linux GOARCH=$arch GOARM=$arm go build -trimpath -ldflags "-s -w" -o "dist/$name" ./cmd/didban
          done
          (cd dist && sha256sum didban_* > checksums.txt)
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
