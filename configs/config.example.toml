# didban configuration. Every key is optional: the defaults match a
# Waveshare Pioneer600 HAT on I²C bus 1. Environment variables override
# the file: DIDBAN_POLL__INTERVAL=5s, DIDBAN_BUZZER__ENABLED=false, ...

[i2c]
bus = "1"

[poll]
interval = "15s"

[server]
# /metrics (Prometheus) and POST /lcd
address = ":9465"

[bmp180]
enabled = true
address = 0x77

[ds3231]
enabled = true
address = 0x68
timezone = "Asia/Tehran"

[adc]
enabled = true
address = 0x48
vref = 3.3
labels = ["potentiometer", "photoresistor", "ain2", "ain3"]

[buzzer]
# active-low buzzer on the PCF8574 I/O expander: bit 7 on the Pioneer600
# (bits 0-3 are the joystick, bit 4 is LED2)
enabled = true
address = 0x20
bit = 7

[joystick]
# five-way switch: directions on the PCF8574 (bits 0-3, active-low), the
# centre on a GPIO with a pull-up (periph's name). beep chirps on each press.
enabled = true
address = 0x20
center = "GPIO20"
poll = "50ms"
beep = true

[ds18b20]
# DS18B20 probes through the kernel 1-Wire driver; needs
# dtoverlay=w1-gpio-pullup in config.txt
enabled = true
dir = "/sys/bus/w1/devices"

[oled]
# 128x64 SSD1306 on SPI (the Pioneer600's display): needs dtparam=spi=on in
# config.txt. Shows the clock, the temperature and the tunnel.
enabled = true
spi = "/dev/spidev0.0"
dc = "GPIO16"
reset = "GPIO19"
contrast = 127
# turn the image by 180 degrees
rotate = false

[led]
# LED1 shows the tunnel: steady = up, flicker = data moving, slow blink =
# fail-open, double flash = the tunnel's API does not answer, off = no tunnel
enabled = true
pin = "GPIO26"

[lcd]
# HD44780 behind a PCF8574 backpack. Off by default: on the Pioneer600,
# 0x20 is the buzzer, and driving it as an LCD makes it beep.
enabled = false
address = 0x27
cols = 16
rows = 2
backlight = true

[tunnel]
# a sing-box tunnel on this host, read through its Clash API (experimental
# clash_api in sing-box): the selector's exit, probe delays, throughput and
# the open flows, on the page and at /api/tunnel. Put the secret in
# DIDBAN_TUNNEL__SECRET rather than here.
enabled = false
api = "http://127.0.0.1:9099"
secret = ""
selector = "tunnel"
poll = "2s"
