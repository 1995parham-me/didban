# didban configuration. Every key is optional: the defaults match a
# Waveshare Pioneer600 HAT on I²C bus 1. Environment variables override
# the file: DIDBAN_POLL__INTERVAL=5s, DIDBAN_BUZZER__ENABLED=false, ...

[i2c]
bus = "1"

[poll]
interval = "15s"

[server]
# /metrics (Prometheus) and POST /lcd
address = ":9465"

[bmp180]
enabled = true
address = 0x77

[ds3231]
enabled = true
address = 0x68
timezone = "Asia/Tehran"

[adc]
enabled = true
address = 0x48
vref = 3.3
labels = ["potentiometer", "photoresistor", "ain2", "ain3"]

[buzzer]
# active-low buzzer on the PCF8574 I/O expander: bit 7 on the Pioneer600
# (bits 0-3 are the joystick, bit 4 is LED2)
enabled = true
address = 0x20
bit = 7

[joystick]
# five-way switch: directions on the PCF8574 (bits 0-3, active-low), the
# centre on a GPIO with a pull-up (periph's name). beep chirps on each press.
enabled = true
address = 0x20
center = "GPIO20"
poll = "50ms"
beep = true

[ds18b20]
# DS18B20 probes through the kernel 1-Wire driver; needs
# dtoverlay=w1-gpio-pullup in config.txt
enabled = true
dir = "/sys/bus/w1/devices"

[lcd]
# HD44780 behind a PCF8574 backpack. Off by default: on the Pioneer600,
# 0x20 is the buzzer, and driving it as an LCD makes it beep.
enabled = false
address = 0x27
cols = 16
rows = 2
backlight = true
